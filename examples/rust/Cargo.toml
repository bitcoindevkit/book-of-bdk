[workspace]
resolver = "2"
members = [
    "descriptors", 
    "migrate-version",
    "recovery-phrases",
    "syncing/electrum",
    "syncing/esplora",
    "syncing/kyoto",
    "syncing/rpc",
    "persistence/memory",
    "persistence/sqlite",
    "starter-example",
    "design-page-signatures",
]
# Standalone projects with their own dependency tree and lockfile (e.g. pinned to unreleased
# bdk_wallet versions). Build them from their own directory.
exclude = [
    "signing",
]

[workspace.package]
authors = ["Bitcoin Dev Kit Developers"]
